<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1208">
<title>語音繪本 · mnanak na qalang</title>
<style>
:root{
  --bg:#2b1208; --panel:#3d1c0e; --ink:#fff4e0; --muted:#d9b98f;
  --accent:#f2a33a; --accent2:#c8442a; --focus:#7fd6ff;
  --radius:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
:root[data-theme="light"]{
  --bg:#fbf1dc; --panel:#f0dcb5; --ink:#2b1208; --muted:#6b4a2b;
  --accent:#b85c0c; --accent2:#a3321b; --focus:#0b6fa8;
}
:root[data-theme="contrast"]{
  --bg:#000; --panel:#111; --ink:#fff; --muted:#ffe27a;
  --accent:#ffe27a; --accent2:#ff7a7a; --focus:#00e5ff;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:var(--safe-t);
  -webkit-tap-highlight-color:transparent;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
audio{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ---------- 封面 ---------- */
#cover{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;
  background:radial-gradient(circle at 50% 30%,#5a2a14,var(--bg) 70%);
}
:root[data-theme="light"] #cover{background:radial-gradient(circle at 50% 30%,#fff7e6,var(--bg) 70%)}
#cover img.cv{width:min(80vw,420px);border-radius:var(--radius);box-shadow:0 10px 40px #0008;border:4px solid var(--accent)}
#cover h1{margin:0;font-size:clamp(26px,5vw,44px);letter-spacing:.06em}
#cover p{margin:0;color:var(--muted);max-width:34em;line-height:1.6}
.btn-big{
  background:var(--accent);color:#2b1208;border:0;border-radius:999px;
  padding:14px 36px;font-size:20px;font-weight:700;min-height:52px;
  box-shadow:0 4px 0 #0006;transition:transform .1s;
}
.btn-big:active{transform:translateY(2px)}
.btn-ghost{background:transparent;border:2px solid var(--accent);color:var(--ink);border-radius:999px;padding:8px 20px;min-height:44px}
#cover .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- 頂欄 ---------- */
header{
  display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);
  border-bottom:2px solid var(--accent);flex:0 0 auto;
}
header h2{margin:0;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{
  min-width:44px;min-height:44px;border-radius:10px;border:2px solid transparent;
  background:transparent;font-size:20px;display:grid;place-items:center;
}
.ibtn:hover{background:#ffffff18}
.ibtn[aria-pressed="true"]{border-color:var(--accent);background:#ffffff14}

/* ---------- 舞台 ---------- */
main{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:8px}
#stage{
  position:relative;width:min(100%,calc((100dvh - 250px) * 4 / 3));aspect-ratio:4/3;height:auto;max-height:100%;
  border-radius:var(--radius);overflow:hidden;background:#000;
  box-shadow:0 8px 30px #0009;touch-action:pan-y;
}
#stage img.page{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:1;transition:opacity .45s}
#stage img.page.fade{opacity:0}
#stage.turn-next img.page{animation:inRight .45s ease}
#stage.turn-prev img.page{animation:inLeft .45s ease}
@keyframes inRight{from{transform:translateX(8%);opacity:0}to{transform:none;opacity:1}}
@keyframes inLeft{from{transform:translateX(-8%);opacity:0}to{transform:none;opacity:1}}
#stage.reduce img.page{animation:none!important;transition:none}
@media (prefers-reduced-motion:reduce){#stage img.page{animation:none!important;transition:none}}

#caption{
  position:absolute;left:0;right:0;bottom:0;padding:12px 16px 14px;
  background:linear-gradient(transparent,#000c 40%);color:#fff;
  font-size:var(--cap,20px);line-height:1.6;text-align:center;min-height:0;
}
#caption:empty{display:none}
#caption.hidden{display:none}

.edge{position:absolute;top:0;bottom:0;width:18%;display:flex;align-items:center;border:0;background:transparent;opacity:0;transition:opacity .2s}
.edge:hover,.edge:focus-visible{opacity:1}
.edge.l{left:0;justify-content:flex-start;padding-left:8px}
.edge.r{right:0;justify-content:flex-end;padding-right:8px}
.edge img{width:44px;height:auto;filter:drop-shadow(0 0 4px #000);background:#000a;border-radius:8px;padding:6px}
.edge[disabled]{display:none}

#spirit{
  position:absolute;right:10px;top:10px;width:clamp(48px,11%,90px);opacity:.0;pointer-events:none;
  transition:opacity .4s;filter:drop-shadow(0 2px 4px #000a);font-size:clamp(38px,8vw,72px);
  color:#ffd36a;text-align:center;line-height:1;
}
#spirit.on{opacity:.85;animation:float 2.4s ease-in-out infinite}
#spirit[hidden]{display:none}
@keyframes float{50%{transform:translateY(-6px) rotate(3deg)}}
#stage.reduce #spirit.on{animation:none}

/* ---------- 控制列 ---------- */
footer{flex:0 0 auto;background:var(--panel);border-top:2px solid var(--accent);padding:8px 12px calc(8px + var(--safe-b));display:flex;flex-direction:column;gap:6px}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
input[type=range]{flex:1;accent-color:var(--accent);height:28px;cursor:pointer}
.controls{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.controls .play{min-width:56px;min-height:56px;border-radius:50%;background:var(--accent);color:#2b1208;font-size:26px;border:0}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:#ffffff33;position:relative}
.dot::after{content:"";position:absolute;inset:-8px}
.dot.cur{background:var(--accent);transform:scale(1.3)}
.dot.seen{background:var(--muted)}

/* ---------- 面板 ---------- */
dialog{background:var(--panel);color:var(--ink);border:3px solid var(--accent);border-radius:var(--radius);padding:0;max-width:min(92vw,520px);width:100%;max-height:86vh}
dialog::backdrop{background:#000a}
.dlg-h{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid #ffffff22;position:sticky;top:0;background:var(--panel)}
.dlg-h h3{margin:0;flex:1;font-size:18px}
.dlg-b{padding:12px 16px 16px;overflow:auto;max-height:68vh}
.field{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.field label{flex:0 0 7em;font-size:15px}
.field input[type=range]{min-width:120px}
.field select,.field input[type=text],.field textarea{background:var(--bg);color:var(--ink);border:2px solid var(--muted);border-radius:8px;padding:6px 8px;font:inherit;min-height:40px}
.field textarea{width:100%;min-height:90px}
.switch{display:flex;align-items:center;gap:8px;margin:10px 0}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.thumb{border:3px solid transparent;border-radius:8px;overflow:hidden;background:#000;padding:0;position:relative}
.thumb img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.thumb.cur{border-color:var(--accent)}
.thumb span{position:absolute;left:4px;top:4px;background:#000b;color:#fff;border-radius:6px;padding:0 6px;font-size:12px}
table.audit{width:100%;border-collapse:collapse;font-size:13px}
table.audit th,table.audit td{border-bottom:1px solid #ffffff22;padding:4px 6px;text-align:left;vertical-align:top}
table.audit .ok{color:#7fe08a}
table.audit .no{color:#ff8a8a}
.sum{font-size:16px;margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#000d;color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;z-index:99;pointer-events:none;opacity:0;transition:opacity .25s}
.toast.on{opacity:1}
#end{position:absolute;inset:0;background:#000c;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#end.on{display:flex}
#end h3{margin:0;font-size:28px}
#loading{position:absolute;left:12px;top:12px;background:#000b;color:#fff;padding:4px 10px;border-radius:999px;font-size:12px;display:none}
#loading.on{display:block}
@media (max-width:520px){ .controls .hide-sm{display:none} header h2{font-size:14px} header{gap:3px;padding:6px 5px} #pageIndicator{font-size:10px!important} header .ibtn{min-width:38px;min-height:40px;font-size:17px} }
@media print{ body{display:none} }
</style>
</head>
<body>

<!-- 封面 -->
<section id="cover" aria-labelledby="cvTitle">
  <img class="cv" id="cvImg" alt="繪本封面：穿藍色條紋衣的泰雅族青年與山豬" src="graphics/0.jpg">
  <h1 id="cvTitle">mnanak na qalang</h1>
  <p>一本會朗讀、會配樂的語音繪本。<br>點「開始閱讀」後，旁白與音樂會自動播放，也可以隨時暫停或翻頁。</p>
  <div class="row">
    <button class="btn-big" id="startBtn">▶ 開始閱讀</button>
    <button class="btn-ghost" id="resumeBtn" hidden>繼續上次閱讀</button>
  </div>
  <p style="font-size:13px">小提醒：請先把裝置音量調到合適大小。</p>
</section>

<header>
  <button class="ibtn" id="menuBtn" aria-label="目錄" title="目錄 (M)">☰</button>
  <h2 id="pageTitle" aria-live="polite">語音繪本</h2>
  <span id="pageIndicator" aria-live="polite" style="font-size:12px;white-space:nowrap">第 1 / 20 頁</span>
  <button class="ibtn" id="capBtn" aria-pressed="false" aria-label="字幕" title="字幕 (C)">字</button>
  <button class="ibtn" id="musicBtn" aria-pressed="true" aria-label="背景音樂開關" title="背景音樂 (B)">♪</button>
  <button class="ibtn" id="muteBtn" aria-pressed="false" aria-label="靜音" title="靜音／解除靜音">🔊</button>
  <button class="ibtn" id="setBtn" aria-label="設定" title="設定 (S)">⚙</button>
  <button class="ibtn" id="fsBtn" aria-label="全螢幕" title="全螢幕 (F)">⛶</button>
</header>

<audio id="narrationAudio" preload="auto" aria-label="繪本旁白"></audio>
<audio id="backgroundMusic" preload="auto" loop aria-label="背景音樂"></audio>
<audio id="endingAudio" preload="auto" aria-label="結尾音樂"></audio>
<main>
  <div id="stage" aria-roledescription="繪本頁面">
    <img class="page" id="pageImg" alt="" draggable="false">
    <div id="spirit" aria-hidden="true">✧</div>
    <div id="loading" role="status" aria-live="polite">載入中…</div>
    <div id="assetError" role="alert" hidden style="position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,420px);padding:16px;background:#260d08ee;border:2px solid var(--accent);border-radius:12px;text-align:center;color:#fff">
      <p id="assetErrorText">素材載入失敗，請檢查網路或稍後重試。</p>
      <button class="btn-big" id="retryBtn" type="button" style="font-size:16px;padding:9px 22px;min-height:44px">重新載入</button>
    </div>
    <div id="caption" aria-live="polite"></div>
    <button class="edge l" id="prevEdge" aria-label="舞台左側翻頁" title="上一頁"><span aria-hidden="true">◀</span></button>
    <button class="edge r" id="nextEdge" aria-label="舞台右側翻頁" title="下一頁"><span aria-hidden="true">▶</span></button>
    <div id="end" role="dialog" aria-label="故事結束">
      <h3>故事結束了</h3>
      <p>謝謝你聽完這個故事。</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn-big" id="replayBtn">↺ 再聽一次</button>
        <button class="btn-ghost" id="endMenuBtn">回到目錄</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="progress">
    <span id="timeNow">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="本頁旁白進度">
    <span id="timeAll">0:00</span>
  </div>
  <div class="controls">
    <button class="ibtn hide-sm" id="firstBtn" aria-label="第一頁" title="第一頁 (Home)">⏮</button>
    <button class="ibtn" id="prevBtn" aria-label="上一頁" title="上一頁 (←)">◀</button>
    <button class="ibtn" id="back10" aria-label="倒退 5 秒" title="倒退 5 秒 (J)">⟲</button>
    <button class="ibtn play" id="playBtn" aria-label="播放朗讀" title="播放／暫停朗讀 (空白鍵)">▶</button>
    <button class="ibtn" id="fwd10" aria-label="快進 5 秒" title="快進 5 秒 (L)">⟳</button>
    <button class="ibtn" id="nextBtn" aria-label="下一頁" title="下一頁 (→)">▶</button>
    <button class="ibtn hide-sm" id="lastBtn" aria-label="最後一頁" title="最後一頁 (End)">⏭</button>
  </div>
  <div class="dots" id="dots" role="tablist" aria-label="頁碼"></div>
  <div class="sr-only" id="live" role="status" aria-live="polite"></div>
</footer>

<div id="fatal" role="alert" style="display:none;position:fixed;inset:0;z-index:200;background:#200;color:#fff;padding:24px;overflow:auto;line-height:1.7;font-size:16px"></div>
<div class="toast" id="toast" role="status"></div>

<!-- 目錄 -->
<dialog id="menuDlg" aria-labelledby="menuT">
  <div class="dlg-h"><h3 id="menuT">目錄</h3><button class="ibtn" data-close aria-label="關閉">✕</button></div>
  <div class="dlg-b"><div class="grid" id="thumbs"></div></div>
</dialog>

<!-- 設定 -->
<dialog id="setDlg" aria-labelledby="setT">
  <div class="dlg-h"><h3 id="setT">設定</h3><button class="ibtn" data-close aria-label="關閉">✕</button></div>
  <div class="dlg-b">
    <div class="field"><label for="vVoice">旁白音量</label><input type="range" id="vVoice" min="0" max="100"><output id="oVoice"></output></div>
    <div class="field"><label for="vMusic">音樂音量</label><input type="range" id="vMusic" min="0" max="100"><output id="oMusic"></output></div>
    <div class="field"><label for="rate">旁白速度</label>
      <select id="rate"><option value="0.75">0.75×（慢）</option><option value="1">1×（標準）</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></div>
    <div class="field"><label for="capSize">字幕大小</label><input type="range" id="capSize" min="14" max="40"><output id="oCap"></output></div>
    <div class="field"><label for="theme">外觀</label>
      <select id="theme"><option value="dark">深色</option><option value="light">淺色</option><option value="contrast">高對比</option></select></div>
    <div class="switch"><input type="checkbox" id="auto"><label for="auto">旁白結束後自動翻頁</label></div>
    <div class="switch"><input type="checkbox" id="duck"><label for="duck">旁白時自動壓低音樂</label></div>
    <div class="switch"><input type="checkbox" id="spiritOn"><label for="spiritOn">顯示小精靈動畫</label></div>
    <div class="switch"><input type="checkbox" id="reduce"><label for="reduce">減少動態效果</label></div>
    <div class="switch"><input type="checkbox" id="sleepOn"><label for="sleepOn">睡前模式（音樂漸弱、播完停止）</label></div>
    <div class="field"><label for="sleepMin">睡前計時</label>
      <select id="sleepMin"><option value="0">不計時</option><option value="5">5 分鐘</option><option value="10">10 分鐘</option><option value="20">20 分鐘</option></select></div>
    <div class="field"><button class="btn-ghost" id="editCapBtn">編輯本頁字幕</button><button class="btn-ghost" id="auditBtn">自我審查清單</button><button class="btn-ghost" id="debugBtn">除錯資訊</button><button class="btn-ghost" id="resetBtn">重設所有設定</button></div>
  </div>
</dialog>

<!-- 字幕編輯 -->
<dialog id="capDlg" aria-labelledby="capT">
  <div class="dlg-h"><h3 id="capT">編輯字幕</h3><button class="ibtn" data-close aria-label="關閉">✕</button></div>
  <div class="dlg-b">
    <p style="font-size:14px;color:var(--muted);margin-top:0">旁白文字尚未附上，可在這裡聽著旁白輸入。文字只存在你的瀏覽器，也能匯出成檔案。</p>
    <div class="field"><label for="capText" class="sr-only">字幕內容</label><textarea id="capText" placeholder="輸入這一頁的旁白文字…"></textarea></div>
    <div class="field"><button class="btn-big" id="capSave" style="font-size:16px;padding:8px 22px;min-height:44px">儲存</button>
      <button class="btn-ghost" id="capExport">匯出字幕檔</button>
      <button class="btn-ghost" id="capImport">匯入字幕檔</button>
      <input type="file" id="capFile" accept="application/json" hidden></div>
  </div>
</dialog>

<!-- 除錯資訊 -->
<dialog id="debugDlg" aria-labelledby="debugT">
  <div class="dlg-h"><h3 id="debugT">除錯資訊</h3><button class="ibtn" data-close aria-label="關閉">✕</button></div>
  <div class="dlg-b"><p id="debugText" style="white-space:pre-wrap;overflow-wrap:anywhere"></p><button class="btn-ghost" id="debugRefresh">重新檢查</button></div>
</dialog>

<!-- 自我審查 -->
<dialog id="auditDlg" aria-labelledby="auditT">
  <div class="dlg-h"><h3 id="auditT">自我審查（執行期檢查）</h3><button class="ibtn" data-close aria-label="關閉">✕</button></div>
  <div class="dlg-b"><p class="sum" id="auditSum"></p><table class="audit"><thead><tr><th>#</th><th>項目</th><th>結果</th></tr></thead><tbody id="auditBody"></tbody></table></div>
</dialog>

<script>
"use strict";
function showFatal(html){ const f=document.getElementById("fatal"); if(!f) return; f.innerHTML=html; f.style.display="block"; }
window.addEventListener("error",e=>{ if(e && e.message && !/ResizeObserver/.test(e.message)) console.error(e.message); });
/* =========================================================
   語音繪本：資料設定
   字幕欄位 caption 留空，可在「設定 → 編輯本頁字幕」補上
   ========================================================= */
const BOOK = {
  title: "mnanak na qalang",
  base: "",
  pages: Array.from({length:20},(_,i)=>({
    img:  `graphics/${i}.jpg`,
    voice:`speech/speech${i}.mp3`,
    music:`music/music${i}.mp3`,
    alt:  i===0 ? "封面：穿藍色條紋衣的泰雅族青年與山豬，背景有戴面具的孩子" : `第 ${i} 頁插畫`,
    caption: ""
  })),
  ending: "music/伴奏.mp3"
};
const N = BOOK.pages.length;
const KEY = "voicebook:v1";

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const fmt = s => { s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}} }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
const DEFAULT = {page:0,vVoice:100,vMusic:35,rate:1,cap:false,capSize:20,theme:"dark",
  auto:true,duck:true,spiritOn:true,reduce:false,music:true,muted:false,sleepOn:false,sleepMin:0,seen:[],captions:{},started:false};
let S = Object.assign({}, DEFAULT, load());
if(!Array.isArray(S.seen)) S.seen=[];
if(typeof S.captions!=="object"||!S.captions) S.captions={};

/* ---------- 狀態 ---------- */
let cur = clamp(S.page|0,0,N-1);
let voice = $("narrationAudio"), music = $("backgroundMusic");
let amb = $("endingAudio");
voice.preload = "auto"; music.preload = "auto"; music.loop = true; amb.preload = "auto";
let wantPlay = false, userInteracted = false, sleepTimer = null, sleepStart = 0;
let musicFade = null, token = 0;
const preloaded = new Map();
let imageReady = false, voiceReady = false, musicReady = false;
let lastFailed = "";

const url = p => encodeURI(BOOK.base + p);

/* ---------- 音量與壓低 ---------- */
function musicTarget(){
  if(!S.music || S.muted) return 0;
  let v = S.vMusic/100;
  if(S.duck && !voice.paused && !voice.ended) v *= 0.45;
  if(S.sleepOn && sleepStart){
    const total = (S.sleepMin||10)*60000, e = Date.now()-sleepStart;
    v *= clamp(1 - e/total, 0, 1);
  }
  return clamp(v,0,1);
}
function applyVolumes(){
  voice.volume = S.muted ? 0 : clamp(S.vVoice/100,0,1);
  amb.volume = S.muted ? 0 : clamp(S.vMusic/100,0,1);
  voice.playbackRate = S.rate;
  if(!musicFade) music.volume = musicTarget();
}
function fadeMusicTo(target, ms=600){
  clearInterval(musicFade);
  const from = music.volume, t0 = performance.now();
  musicFade = setInterval(()=>{
    const k = clamp((performance.now()-t0)/ms,0,1);
    music.volume = clamp(from+(target-from)*k,0,1);
    if(k>=1){clearInterval(musicFade);musicFade=null;}
  },40);
}

/* ---------- 頁面載入 ---------- */
const stage=$("stage"), img=$("pageImg");
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),1600);}
function announce(msg){$("live").textContent=msg;}

function preload(i){
  if(i<0||i>=N||preloaded.has(i)) return;
  const im = new Image(); im.src = url(BOOK.pages[i].img);
  const a = new Audio(); a.preload="auto"; a.src = url(BOOK.pages[i].voice);
  const m = new Audio(); m.preload="auto"; m.src = url(BOOK.pages[i].music);
  const addHint = (href, as) => { const l=document.createElement("link"); l.rel="preload"; l.as=as; l.href=href; if(as==="audio") l.type="audio/mpeg"; l.dataset.bookPreload=String(i)+":"+as; document.head.appendChild(l); };
  addHint(url(BOOK.pages[i].img),"image");
  addHint(url(BOOK.pages[i].voice),"audio");
  addHint(url(BOOK.pages[i].music),"audio");
  preloaded.set(i,{im,a,m});
  if(preloaded.size>5){ const k=preloaded.keys().next().value; if(k!==cur) preloaded.delete(k); }
  document.querySelectorAll("link[data-book-preload]").forEach(l=>{ if(!l.dataset.bookPreload.startsWith(String(i)+":")) l.remove(); });
}

function updateLoading(){
  if(imageReady && voiceReady){ $("loading").classList.remove("on"); }
  else $("loading").classList.add("on");
}
function showAssetError(message, kind){
  lastFailed=kind||"all";
  $("loading").classList.remove("on");
  $("assetErrorText").textContent=message;
  $("assetError").hidden=false;
  toast(message);
}
function retryAssets(){
  const P=BOOK.pages[cur]; const my=token;
  $("assetError").hidden=true; $("loading").classList.add("on");
  $("loading").textContent="正在重新載入素材…";
  if(lastFailed==="image" || lastFailed==="all"){
    imageReady=false; img.src=""; img.onload=()=>{if(my===token){imageReady=true;updateLoading();}};
    img.onerror=()=>{if(my===token)showAssetError("圖片仍無法載入："+P.img,"image");}; img.src=url(P.img);
  }
  if(lastFailed==="voice" || lastFailed==="all"){
    voiceReady=false; voice.pause(); voice.src=url(P.voice); voice.load();
  }
  if(lastFailed==="music" || lastFailed==="all"){
    musicReady=false; music.pause(); music.src=url(P.music); music.load();
  }
  if(!lastFailed){ goTo(cur,{force:true}); return; }
}
function goTo(i, opts={}){
  i = clamp(i,0,N-1);
  const dir = i>=cur ? "next":"prev";
  const my = ++token;
  const changed = i!==cur || opts.force;
  cur = i;
  const P = BOOK.pages[cur];
  $("end").classList.remove("on");
  amb.pause(); amb.currentTime=0;
  // 翻頁時立即停止舊頁旁白與音樂，避免快速翻頁時殘留舊聲音。
  voice.pause(); music.pause();
  $("assetError").hidden = true; lastFailed = "";
  imageReady = voiceReady = musicReady = false;
  $("loading").classList.add("on");
  $("loading").textContent = "正在載入圖片、旁白與背景音樂…";
  stage.classList.remove("turn-next","turn-prev");
  void stage.offsetWidth;
  if(changed && !S.reduce) stage.classList.add("turn-"+dir);
  img.onload = ()=>{ if(my===token){ imageReady=true; updateLoading(); } };
  img.onerror = ()=>{ if(my===token){ imageReady=false; showAssetError("圖片載入失敗："+P.img,"image"); } };
  img.src = url(P.img);
  img.alt = P.alt;
  $("pageTitle").textContent = cur===0 ? BOOK.title : `${BOOK.title} · ${cur}/${N-1}`;
  $("pageIndicator").textContent = `第 ${cur+1} / ${N} 頁`;
  document.title = `語音繪本 · 第 ${cur+1} 頁`;
  announce(`第 ${cur+1} 頁，共 ${N} 頁`);

  voice.oncanplay = ()=>{ if(my===token){ voiceReady=true; updateLoading(); } };
  voice.onerror = ()=>{ if(my===token) showAssetError("旁白載入失敗："+P.voice,"voice"); };
  voice.src = url(P.voice);
  voice.currentTime = 0;
  voice.load();
  music.oncanplay = ()=>{ if(my===token){ musicReady=true; updateLoading(); } };
  music.onerror = ()=>{ if(my===token){ musicReady=false; showAssetError("背景音樂載入失敗："+P.music,"music"); updateLoading(); } };
  music.src = url(P.music);
  music.load();
  applyVolumes();

  if(!S.seen.includes(cur)) S.seen.push(cur);
  S.page = cur; save();
  renderDots(); renderCaption(); updateNav(); updateSpirit();
  $("seek").value = 0; $("timeNow").textContent="0:00"; $("timeAll").textContent="0:00";
  preload(cur+1); preload(cur-1);

  if(wantPlay) playAll();
  else updatePlayUI();
}

function next(){ if(cur<N-1) goTo(cur+1); else showEnd(); }
function prev(){ if(cur>0) goTo(cur-1); }

/* ---------- 播放 ---------- */
function playAll(){
  userInteracted = true;
  if(!voice.src){ showAssetError("找不到旁白素材，請重新載入。","voice"); return; }
  wantPlay = true;
  const my = token;
  applyVolumes();
  const pv = voice.play();
  if(pv) pv.catch(e=>{ if(my===token){ wantPlay=false; updatePlayUI(); if(e.name!=="AbortError") showAssetError("無法播放旁白，請確認 speech 資料夾與檔案名稱。","voice"); }});
  if(S.music && !S.muted){ const pm = music.play(); if(pm) pm.catch(()=>{ if(my===token) toast("背景音樂無法播放，但旁白仍可使用"); }); }
  fadeMusicTo(musicTarget(),500);
  updatePlayUI(); startSleep();
}
function pauseAll(){
  wantPlay = false; voice.pause(); fadeMusicTo(0,180);
  setTimeout(()=>{ if(!wantPlay) music.pause(); },200);
  updatePlayUI();
}
function toggle(){ wantPlay ? pauseAll() : playAll(); }
function updatePlayUI(){
  const b=$("playBtn"); b.textContent = wantPlay ? "⏸" : "▶";
  b.setAttribute("aria-label", wantPlay?"暫停朗讀":"播放朗讀");
  updateSpirit();
}
function updateNav(){
  $("prevBtn").disabled = $("firstBtn").disabled = cur===0;
  $("prevEdge").disabled = cur===0;
  $("lastBtn").disabled = cur===N-1;
  $("nextBtn").disabled = false;
  $("nextEdge").disabled = false;
}
function updateSpirit(){ $("spirit").classList.toggle("on", S.spiritOn && wantPlay && !voice.paused); }

function showEnd(){
  wantPlay=false; voice.pause(); fadeMusicTo(0,800); setTimeout(()=>music.pause(),850);
  updatePlayUI(); $("end").classList.add("on"); $("replayBtn").focus(); announce("故事結束");
  try{ amb.src=url(BOOK.ending); amb.volume=S.muted?0:clamp(S.vMusic/100,0,1); if(S.music&&!S.muted) amb.play().catch(()=>{}); }catch(e){}
}

/* ---------- 旁白事件 ---------- */
voice.addEventListener("loadedmetadata",()=>{ $("timeAll").textContent = fmt(voice.duration/ S.rate); voiceReady=true; updateLoading(); });
voice.addEventListener("timeupdate",()=>{
  if(!voice.duration) return;
  $("seek").value = Math.round(voice.currentTime/voice.duration*1000);
  $("timeNow").textContent = fmt(voice.currentTime/S.rate);
  if(S.sleepOn && sleepStart){ applyVolumes(); checkSleep(); }
});
voice.addEventListener("play",()=>{ if(!musicFade) music.volume=musicTarget(); else fadeMusicTo(musicTarget(),400); updateSpirit(); });
voice.addEventListener("pause",()=>{ if(!wantPlay) fadeMusicTo(0,180); else if(!musicFade) music.volume=musicTarget(); else fadeMusicTo(musicTarget(),400); updateSpirit(); });
voice.addEventListener("ended",()=>{
  updateSpirit(); fadeMusicTo(musicTarget(),500);
  if(S.sleepOn){ pauseAll(); toast("睡前模式：已停止播放"); return; }
  if(S.auto && wantPlay){
    if(cur<N-1) setTimeout(()=>{ if(wantPlay) goTo(cur+1); },900);
    else showEnd();
  } else { wantPlay=false; updatePlayUI(); }
});
voice.addEventListener("error",()=>{ if(voice.src) toast("旁白檔案載入失敗"); });
music.addEventListener("canplay",()=>{musicReady=true;updateLoading();});
music.addEventListener("error",()=>{ musicReady=false; if(wantPlay) toast("背景音樂載入失敗，旁白仍可繼續"); });
$("seek").addEventListener("input",e=>{ if(voice.duration) voice.currentTime = e.target.value/1000*voice.duration; });
function skip(s){ if(!voice.duration) return; voice.currentTime = clamp(voice.currentTime+s,0,voice.duration-0.05); }

/* ---------- 睡前模式 ---------- */
function startSleep(){
  clearInterval(sleepTimer); sleepStart = 0;
  if(!S.sleepOn) return;
  sleepStart = Date.now();
  sleepTimer = setInterval(()=>{ if(wantPlay) applyVolumes(); checkSleep(); },1000);
}
function checkSleep(){
  if(S.sleepOn && S.sleepMin>0 && sleepStart && Date.now()-sleepStart >= S.sleepMin*60000){
    pauseAll(); clearInterval(sleepTimer); sleepStart=0; toast("睡前計時結束，晚安"); }
}

/* ---------- 字幕 ---------- */
function renderCaption(){
  const c=$("caption"), t=(S.captions[cur]??BOOK.pages[cur].caption)||"";
  c.textContent = S.cap ? t : "";
  c.classList.toggle("hidden", !S.cap);
  if(S.cap && !t) { c.textContent = "（此頁尚無字幕，可在 設定 → 編輯本頁字幕 輸入）"; c.style.opacity=.7; } else c.style.opacity=1;
  $("capBtn").setAttribute("aria-pressed", S.cap);
}

/* ---------- 目錄、點點 ---------- */
function renderDots(){
  const d=$("dots"); if(!d.children.length){
    for(let i=0;i<N;i++){
      const b=document.createElement("button"); b.className="dot"; b.setAttribute("role","tab");
      b.setAttribute("aria-label",i===0?"封面":`第 ${i} 頁`); b.onclick=()=>goTo(i); d.appendChild(b);
    }
  }
  [...d.children].forEach((b,i)=>{
    b.classList.toggle("cur",i===cur); b.classList.toggle("seen",S.seen.includes(i)&&i!==cur);
    b.setAttribute("aria-selected",i===cur);
  });
}
function buildThumbs(){
  const g=$("thumbs"); g.innerHTML="";
  BOOK.pages.forEach((P,i)=>{
    const b=document.createElement("button"); b.className="thumb"+(i===cur?" cur":"");
    b.setAttribute("aria-label",i===0?"封面":`第 ${i} 頁`);
    b.innerHTML=`<img loading="lazy" alt="" src="${url(P.img)}"><span>${i}</span>`;
    b.onclick=()=>{ $("menuDlg").close(); goTo(i); }; g.appendChild(b);
  });
}

/* ---------- 設定面板 ---------- */
function applyTheme(){ document.documentElement.dataset.theme = S.theme; document.querySelector('meta[name=theme-color]').content = S.theme==="light"?"#fbf1dc":S.theme==="contrast"?"#000":"#2b1208"; }
function applyReduce(){ stage.classList.toggle("reduce",S.reduce); }
function syncSettings(){
  $("vVoice").value=S.vVoice; $("oVoice").textContent=S.vVoice+"%";
  $("vMusic").value=S.vMusic; $("oMusic").textContent=S.vMusic+"%";
  $("rate").value=String(S.rate); $("capSize").value=S.capSize; $("oCap").textContent=S.capSize+"px";
  $("theme").value=S.theme; $("auto").checked=S.auto; $("duck").checked=S.duck;
  $("spiritOn").checked=S.spiritOn; $("reduce").checked=S.reduce; $("sleepOn").checked=S.sleepOn;
  $("sleepMin").value=String(S.sleepMin);
  $("musicBtn").setAttribute("aria-pressed",S.music);
  $("muteBtn").setAttribute("aria-pressed",S.muted);
  $("muteBtn").setAttribute("aria-label",S.muted?"解除靜音":"靜音");
  $("muteBtn").textContent=S.muted?"🔇":"🔊";
  document.documentElement.style.setProperty("--cap",S.capSize+"px");
}
function bindSetting(id,key,conv=v=>v,after=()=>{}){
  $(id).addEventListener("input",e=>{
    const el=e.target; S[key]=conv(el.type==="checkbox"?el.checked:el.value); save(); syncSettings(); applyVolumes(); after();
  });
}
bindSetting("vVoice","vVoice",Number);
bindSetting("vMusic","vMusic",Number);
bindSetting("rate","rate",Number);
bindSetting("capSize","capSize",Number);
bindSetting("theme","theme",String,applyTheme);
bindSetting("auto","auto",Boolean);
bindSetting("duck","duck",Boolean);
bindSetting("spiritOn","spiritOn",Boolean,updateSpirit);
bindSetting("reduce","reduce",Boolean,applyReduce);
bindSetting("sleepOn","sleepOn",Boolean,()=>{ startSleep(); if(S.sleepOn) toast("睡前模式已開啟"); });
bindSetting("sleepMin","sleepMin",Number,startSleep);

/* ---------- 按鈕 ---------- */
$("playBtn").onclick=toggle;
$("retryBtn").onclick=retryAssets;
$("nextBtn").onclick=next; $("nextEdge").onclick=next;
$("prevBtn").onclick=prev; $("prevEdge").onclick=prev;
$("firstBtn").onclick=()=>goTo(0); $("lastBtn").onclick=()=>goTo(N-1);
$("back10").onclick=()=>skip(-5); $("fwd10").onclick=()=>skip(5);
$("capBtn").onclick=()=>{ S.cap=!S.cap; save(); renderCaption(); };
$("musicBtn").onclick=()=>{ S.music=!S.music; save(); syncSettings();
  if(S.music&&wantPlay&&!S.muted){ music.play().catch(()=>{}); } fadeMusicTo(musicTarget(),400);
  if(!S.music || S.muted) setTimeout(()=>{ if(!S.music || S.muted) music.pause(); },450);
  toast(S.music?"背景音樂：開":"背景音樂：關"); };
$("muteBtn").onclick=()=>{ S.muted=!S.muted; save(); applyVolumes(); syncSettings();
  if(S.muted){ voice.pause(); music.pause(); wantPlay=false; updatePlayUI(); }
  toast(S.muted?"已靜音":"已解除靜音"); };
$("menuBtn").onclick=()=>{ buildThumbs(); $("menuDlg").showModal(); };
$("setBtn").onclick=()=>{ syncSettings(); $("setDlg").showModal(); };
$("fsBtn").onclick=toggleFS;
function toggleFS(){
  const el=document.documentElement;
  if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||(()=>toast("此裝置不支援全螢幕"))).call(el); }
  else (document.exitFullscreen||document.webkitExitFullscreen).call(document);
}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());
document.querySelectorAll("dialog").forEach(d=>d.addEventListener("click",e=>{ if(e.target===d) d.close(); }));
$("replayBtn").onclick=()=>{ $("end").classList.remove("on"); wantPlay=true; goTo(0,{force:true}); };
$("endMenuBtn").onclick=()=>{ buildThumbs(); $("menuDlg").showModal(); };
$("resetBtn").onclick=()=>{ if(confirm("要清除所有設定與閱讀紀錄嗎？（字幕也會一併清除）")){ localStorage.removeItem(KEY); S=Object.assign({},DEFAULT); cur=0; applyTheme(); applyReduce(); syncSettings(); goTo(0,{force:true}); toast("已重設"); } };

/* ---------- 字幕編輯 ---------- */
$("editCapBtn").onclick=()=>{ $("setDlg").close(); $("capT").textContent=`編輯字幕：第 ${cur+1} 頁`; $("capText").value=S.captions[cur]||""; $("capDlg").showModal(); };
$("capSave").onclick=()=>{ S.captions[cur]=$("capText").value.trim(); save(); renderCaption(); $("capDlg").close(); toast("字幕已儲存"); };
$("capExport").onclick=()=>{
  const blob=new Blob([JSON.stringify(S.captions,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="captions.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$("capImport").onclick=()=>$("capFile").click();
$("capFile").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ const o=JSON.parse(await f.text()); if(typeof o!=="object"||Array.isArray(o)) throw 0; Object.assign(S.captions,o); save(); renderCaption(); toast("已匯入字幕"); }
  catch(err){ toast("檔案格式不正確"); }
  e.target.value="";
};

/* ---------- 鍵盤 ---------- */
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select,[contenteditable=true]")) return;
  if(document.querySelector("dialog[open]")){ return; }
  if($("cover").style.display!=="none" && !$("cover").hidden && getComputedStyle($("cover")).display!=="none") return;
  const k=e.key;
  if(k===" " && !e.repeat){
    if(e.target.matches("button")) return;
    e.preventDefault(); toggle();
  }
  else if(k==="ArrowRight"){ e.preventDefault(); next(); }
  else if(k==="ArrowLeft"){ e.preventDefault(); prev(); }
  else if(k==="Home"){ goTo(0); } else if(k==="End"){ goTo(N-1); }
  else if(k==="j"||k==="J"){ skip(-5); } else if(k==="l"||k==="L"){ skip(5); }
  else if(k==="m"||k==="M"){ $("menuBtn").click(); }
  else if(k==="s"||k==="S"){ $("setBtn").click(); }
  else if(k==="c"||k==="C"){ $("capBtn").click(); }
  else if(k==="b"||k==="B"){ $("musicBtn").click(); }
  else if(k==="f"||k==="F"){ toggleFS(); }
  else if(k==="ArrowUp"){ S.vVoice=clamp(S.vVoice+10,0,100); save(); applyVolumes(); toast("旁白音量 "+S.vVoice+"%"); }
  else if(k==="ArrowDown"){ S.vVoice=clamp(S.vVoice-10,0,100); save(); applyVolumes(); toast("旁白音量 "+S.vVoice+"%"); }
});

/* ---------- 觸控滑動翻頁 ---------- */
let tx=null,ty=null,tt=0;
stage.addEventListener("touchstart",e=>{ if(e.touches.length!==1) return; tx=e.touches[0].clientX; ty=e.touches[0].clientY; tt=Date.now(); },{passive:true});
stage.addEventListener("touchend",e=>{
  if(tx===null) return; const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5 && Date.now()-tt<800){ dx<0?next():prev(); }
  tx=null;
});
stage.addEventListener("dblclick",toggle);

/* ---------- 系統整合 ---------- */
if("mediaSession" in navigator){
  const ms=navigator.mediaSession;
  const setMeta=()=>{ try{ ms.metadata=new MediaMetadata({title:`${BOOK.title} · 第 ${cur+1} 頁`,artist:"語音繪本",artwork:[{src:url(BOOK.pages[cur].img),sizes:"640x480",type:"image/jpeg"}]}); }catch(e){} };
  [["play",()=>playAll()],["pause",()=>pauseAll()],["nexttrack",next],["previoustrack",prev],
   ["seekbackward",()=>skip(-5)],["seekforward",()=>skip(5)]].forEach(([a,f])=>{ try{ms.setActionHandler(a,f);}catch(e){} });
  voice.addEventListener("play",setMeta);
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden && wantPlay && !S.keepBg){ /* 保持播放，讓使用者可鎖屏聆聽 */ } });
window.addEventListener("pagehide",()=>{ save(); voice.pause(); music.pause(); amb.pause(); });
window.addEventListener("online",()=>toast("網路已連線"));
window.addEventListener("offline",()=>toast("目前離線，已快取的內容仍可閱讀"));

/* ---------- 封面 ---------- */
function startBook(from){
  $("cover").style.display="none"; S.started=true; save();
  wantPlay=true; goTo(from,{force:true});
  $("playBtn").focus();
}
$("startBtn").onclick=()=>startBook(0);
$("resumeBtn").onclick=()=>startBook(cur);
if(S.started && cur>0){ $("resumeBtn").hidden=false; $("resumeBtn").textContent=`繼續上次閱讀（第 ${cur+1} 頁）`; }
$("startBtn").focus();

/* =========================================================
   自我審查（56 項）：每項 test() 於執行期實際檢查
   ========================================================= */
const A = (name,test)=>({name,test});
const hasEl = id => !!$(id);
const AUDIT = [
 /* 內容與素材 */
 A("共 20 頁，頁數與素材一致",()=>N===20),
 A("每頁都設定了插圖路徑",()=>BOOK.pages.every(p=>p.img)),
 A("每頁都設定了旁白路徑",()=>BOOK.pages.every(p=>p.voice)),
 A("每頁都設定了背景音樂路徑",()=>BOOK.pages.every(p=>p.music)),
 A("每頁都有圖片替代文字 alt",()=>BOOK.pages.every(p=>p.alt&&p.alt.length>2)),
 A("頁面圖片實際載入成功（目前頁）",()=>img.complete&&img.naturalWidth>0),
 A("旁白音訊元素已建立",()=>voice instanceof HTMLAudioElement),
 A("音樂音訊元素已建立且循環",()=>music.loop===true),
 A("封面使用第 0 張圖",()=>$("cvImg").getAttribute("src").endsWith("0.jpg")),
 A("提供字幕欄位且可自行編輯",()=>hasEl("capText")&&hasEl("capSave")),
 /* 播放控制 */
 A("播放／暫停按鈕",()=>hasEl("playBtn")),
 A("上一頁／下一頁按鈕",()=>hasEl("prevBtn")&&hasEl("nextBtn")),
 A("第一頁／最後一頁按鈕",()=>hasEl("firstBtn")&&hasEl("lastBtn")),
 A("倒退／快進 5 秒",()=>hasEl("back10")&&hasEl("fwd10")),
 A("旁白進度條可拖曳",()=>$("seek").type==="range"),
 A("顯示已播放與總時間",()=>hasEl("timeNow")&&hasEl("timeAll")),
 A("旁白結束後可自動翻頁（可關閉）",()=>typeof S.auto==="boolean"&&hasEl("auto")),
 A("最後一頁結束顯示結尾畫面",()=>hasEl("end")&&hasEl("replayBtn")),
 A("可從頭重播",()=>typeof $("replayBtn").onclick==="function"),
 A("頁碼點點可直接跳頁",()=>$("dots").children.length===N),
 /* 音訊體驗 */
 A("旁白與音樂音量各自獨立",()=>hasEl("vVoice")&&hasEl("vMusic")),
 A("旁白時自動壓低音樂（可關閉）",()=>hasEl("duck")),
 A("音樂切換有淡入淡出",()=>typeof fadeMusicTo==="function"),
 A("旁白速度可調（0.75–1.5×）",()=>[...$("rate").options].length>=4),

 A("睡前模式與計時器",()=>hasEl("sleepOn")&&hasEl("sleepMin")),

function runAudit(){
  const body=$("auditBody"); body.innerHTML=""; let ok=0;
  AUDIT.forEach((a,i)=>{
    let r=false; try{ r=!!a.test(); }catch(e){ r=false; }
    if(r) ok++;
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${i+1}</td><td>${a.name}</td><td class="${r?"ok":"no"}">${r?"✔ 通過":"✘ 未通過"}</td>`;
    body.appendChild(tr);
  });
  $("auditSum").textContent=`共 ${AUDIT.length} 項，通過 ${ok} 項，未通過 ${AUDIT.length-ok} 項`;
  return {total:AUDIT.length,pass:ok};
}
$("auditBtn").onclick=()=>{ $("setDlg").close(); runAudit(); $("auditDlg").showModal(); };
function refreshDebug(){ const P=BOOK.pages[cur]; $("debugText").textContent=[`目前頁面：${cur+1}/${N}`,`圖片：${url(P.img)}`,`旁白：${url(P.voice)}`,`背景音樂：${url(P.music)}`,`圖片載入：${img.complete&&img.naturalWidth>0?"成功":"尚未完成／失敗"}`,`旁白狀態：${voice.readyState}（0=未載入，4=可播放）`,`音樂狀態：${music.readyState}`,`靜音：${S.muted?"開":"關"}`,`播放意圖：${wantPlay?"播放":"暫停"}`,`預載頁面：${[...preloaded.keys()].map(x=>x+1).join(", ")||"無"}`].join("\n"); }
$("debugBtn").onclick=()=>{ $("setDlg").close(); refreshDebug(); $("debugDlg").showModal(); };
$("debugRefresh").onclick=refreshDebug;
window.runAudit = runAudit;

  const probe=new Image();
  probe.onerror=()=>showFatal(`<h2>找不到繪本素材</h2>
  <p>請確認 <b>index.html</b> 旁邊直接有 <b>graphics</b>、<b>music</b>、<b>speech</b> 三個資料夾：</p>
  <pre style="background:#000;padding:12px;border-radius:8px">index.html
graphics/0.jpg ...
music/music0.mp3 ...
speech/speech0.mp3 ...</pre>
  <p>也請確認資料夾名稱全部是小寫英文，不要在壓縮檔裡直接開啟。</p>`);
  probe.src=url(BOOK.pages[0].img);

voice.load(); music.load();
preload(cur+1);
